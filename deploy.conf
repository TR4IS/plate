# Used by `gdeploy` (see code-tools). Tells it where Plate lives on the server.
SERVER=cracker@192.168.9.150
REMOTE_DIR=/home/cracker/plate
CONTAINER=plate
# Plate keeps its AI keys inside the app (Settings), so no .env is needed. If one is added on the server, a deploy never touches it
KEEP=".env"
REQUIRE_ENV=0
COMPOSE_FILES="docker-compose.yml docker-compose.server.yml"
SERVICES="plate"
# the database + meal photos live in this Docker volume; gdeploy copies it to ~/backups before every real deploy
BACKUP_VOLUMES="plate_plate-data"
